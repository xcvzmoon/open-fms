name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build workspace packages
        run: vp run --filter "@open-fms/database" --filter "@open-fms/mailer" --filter "@open-fms/storage" --filter "@open-fms/lifecycle" --filter "@open-fms/scan-worker" build

      - name: Run format, lint, and type checks
        run: vp run check

      - name: Validate database migrations
        run: |
          vp run --filter "@open-fms/database" check
          vp run --filter "@open-fms/database" generate
          git diff --exit-code packages/database/migrations

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: open-fms
          POSTGRES_PASSWORD: open-fms
          POSTGRES_DB: open-fms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      storage:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_UNSAFE_BYPASS_DISK_CHECK: 'true'
        ports:
          - 9000:9000
        options: >-
          --tmpfs /data
          --health-cmd "curl -f http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: postgres://open-fms:open-fms@localhost:5432/open-fms
      STORAGE_TEST_ENDPOINT: http://127.0.0.1:9000
      STORAGE_TEST_ACCESS_KEY_ID: rustfsadmin
      STORAGE_TEST_SECRET_ACCESS_KEY: rustfsadmin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build workspace packages
        run: vp run --filter "@open-fms/database" --filter "@open-fms/mailer" --filter "@open-fms/storage" --filter "@open-fms/lifecycle" --filter "@open-fms/scan-worker" build

      - name: Run database migrations
        run: vp run --filter "@open-fms/database" migrate

      - name: Test
        run: vp run test

  ci:
    name: CI
    if: always()
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi

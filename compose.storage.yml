# Local S3-compatible backend for @open-fms/storage integration tests.
#
#   docker compose -f compose.storage.yml up -d --wait
#   STORAGE_TEST_ENDPOINT=http://127.0.0.1:9000 \
#   STORAGE_TEST_ACCESS_KEY_ID=rustfsadmin \
#   STORAGE_TEST_SECRET_ACCESS_KEY=rustfsadmin \
#     vp run test
#   docker compose -f compose.storage.yml down -v
#
# RustFS is a supported backend (StorageBackendKind). MinIO no longer publishes
# official container images or binary downloads. The test suites create the
# quarantine/clean/forensic buckets themselves.

services:
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 12
